name: Locust 부하 테스트

on:
  push:
    branches:
      - locust
  pull_request:
    branches:
      - locust

jobs:
  부하테스트:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install locust fastapi uvicorn

      - name: FastAPI 서버 실행
        run: |
          uvicorn api_server:app --host 0.0.0.0 --port 8000 &

      - name: Locust 부하 테스트 실행
        run: |
          locust \
            -f locustfile.py \
            --headless \
            -u 10 \
            -r 2 \
            -t 30s \
            --host http://127.0.0.1:8000 \
            --only-summary